<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Universe Engine TV</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- Launcher shell: brand splash + connectivity gate. OK opens the live
         sky; offline shows an honest message and OK retries. Back (461)
         exits the app — LG QA requirement. -->
    <main class="shell">
      <div class="stars" aria-hidden="true"></div>
      <section class="card" aria-labelledby="title">
        <p class="eyebrow">A quiet place</p>
        <h1 id="title">The Sky</h1>
        <p class="lede" id="statusText">
          The real night sky, drifting in real time &mdash; planets, the Milky
          Way, black holes &mdash; with optional piano.
        </p>
        <button class="action" type="button" id="enterBtn" autofocus>
          <span class="action__label">Enter the sky</span>
          <span class="action__meta">OK to begin &middot; Back to exit</span>
        </button>
        <p class="footer-note">Ankur Sinha &middot; Universe Engine &middot; real positions, real time</p>
      </section>
    </main>
    <script src="js/main.js"></script>
  </body>
</html>
