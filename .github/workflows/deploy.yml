name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# One concurrent deploy at a time; cancel any in-flight run that gets queued.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Ensure Git LFS assets are present
        run: git lfs pull

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build (Next.js static export)
        # NEXT_PUBLIC_GOOGLE_MAPS_KEY is inlined into the client bundle at build
        # time (Map Tiles API — photoreal Earth). Sourced from a repo secret so
        # the raw key is never committed. The key is HTTP-referrer-restricted to
        # www.sinhaankur.com in Google Cloud, so shipping it in the bundle is
        # safe — it can't be used off-domain. If the secret is unset, the build
        # still succeeds and the photoreal-Earth feature simply stays hidden.
        run: pnpm build
        env:
          NEXT_PUBLIC_GOOGLE_MAPS_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_KEY }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # next.config.mjs sets `output: "export"`, which writes the static site to `out/`.
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
