name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Daily data-refresh deploy: the /lab/celestial catalog + conjunction screen
  # are baked static data — this keeps them fresh without a code push.
  schedule:
    - cron: "0 6 * * *"

# One concurrent deploy at a time; cancel any in-flight run that gets queued.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Checkout WITHOUT LFS first: fetching LFS blobs during checkout is the most
      # failure-prone part (a single LFS smudge/network hiccup fails the whole
      # checkout step and skips the entire deploy — the 2026-07-20 transient
      # failure). We pull LFS separately, with retries, so a blip no longer kills
      # the deploy.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Ensure Git LFS assets are present (retryable)
        run: |
          for attempt in 1 2 3; do
            echo "git lfs pull attempt $attempt…"
            if git lfs pull; then
              echo "LFS assets present."
              exit 0
            fi
            echo "::warning::git lfs pull failed (attempt $attempt) — retrying in 10s"
            sleep 10
          done
          echo "::error::git lfs pull failed after 3 attempts"
          exit 1

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 24: the conjunction bake runs .ts directly via Node's native
          # type-stripping (23.6+).
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Refresh orbital data (CelesTrak TLEs + conjunction screen)
        # Live-ish data on a static site: re-fetch the 18k-object catalog and
        # re-screen the next 24h of close approaches on every deploy AND the
        # daily scheduled run. If CelesTrak is unreachable, deploy proceeds on
        # the committed snapshot — never break the site on a third-party outage.
        run: |
          (node scripts/fetch-satellites.mjs && node scripts/bake-conjunctions.ts) || echo "::warning::orbital data refresh failed — deploying with committed snapshot"

      - name: Refresh flight snapshot (OpenSky ADS-B)
        # The "planes" layer: OpenSky blocks browser CORS, so we bake a real
        # snapshot server-side each deploy. Fetch failure keeps the committed
        # flights.json (the script self-exits 0), never breaking the deploy.
        run: |
          node scripts/bake-flights.mjs || echo "::warning::flight snapshot refresh failed — deploying with committed snapshot"

      - name: Build (Next.js static export)
        # NEXT_PUBLIC_GOOGLE_MAPS_KEY is inlined into the client bundle at build
        # time (Map Tiles API — photoreal Earth). Sourced from a repo secret so
        # the raw key is never committed. The key is HTTP-referrer-restricted to
        # www.sinhaankur.com in Google Cloud, so shipping it in the bundle is
        # safe — it can't be used off-domain. If the secret is unset, the build
        # still succeeds and the photoreal-Earth feature simply stays hidden.
        run: pnpm build
        env:
          NEXT_PUBLIC_GOOGLE_MAPS_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_KEY }}
          # Google 3D Tiles need ACTIVE billing on the Cloud project even while
          # free credits remain. Billing is currently disabled, so the photoreal
          # "Descend to Earth" feature can't load — set this to "false" to hide
          # its entry point cleanly (no black screen). Flip back to "true" (or
          # remove) if billing is ever re-enabled.
          NEXT_PUBLIC_GOOGLE_EARTH_ENABLED: "false"
          # NASA API key (NeoWs asteroids + DONKI). Free/read-only/rate-limited;
          # ships in the bundle. Falls back to DEMO_KEY in code if the secret is unset.
          NEXT_PUBLIC_NASA_KEY: ${{ secrets.NEXT_PUBLIC_NASA_KEY }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # next.config.mjs sets `output: "export"`, which writes the static site to `out/`.
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      # Purge Cloudflare's edge cache after a successful deploy so the new build
      # goes live instantly instead of waiting for cached assets to expire. Uses
      # a SCOPED, cache-purge-only API token (repo secret CLOUDFLARE_PURGE_TOKEN)
      # + the zone id (CLOUDFLARE_ZONE_ID). If either secret is unset the step
      # self-skips inside the script, so the deploy never fails on account of it.
      - name: Purge Cloudflare cache
        env:
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_PURGE_TOKEN }}
        run: |
          if [ -z "$CF_ZONE" ] || [ -z "$CF_TOKEN" ]; then
            echo "Cloudflare secrets not set — skipping cache purge."
            exit 0
          fi
          echo "Purging Cloudflare cache for zone $CF_ZONE…"
          resp=$(curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/purge_cache" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          echo "$resp"
          echo "$resp" | grep -q '"success":true' \
            && echo "✓ Cloudflare cache purged" \
            || echo "::warning::Cloudflare purge did not report success (deploy still fine)"
