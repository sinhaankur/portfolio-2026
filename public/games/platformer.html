<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <title>Cavern Dash — Simple Games</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f0">
  <link rel="icon" href="../img/logo.png">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link href="css/retro.css" rel="stylesheet">
  <style>
    html, body { margin: 0; min-height: 100dvh; overflow-x: hidden; }
    body {
      display: flex; flex-direction: column; align-items: center; gap: 0.75rem;
      padding:
        max(0.75rem, env(safe-area-inset-top))
        max(0.75rem, env(safe-area-inset-right))
        max(0.75rem, env(safe-area-inset-bottom))
        max(0.75rem, env(safe-area-inset-left));
    }
    .game-topbar { width: min(100%, 760px); display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
    .back-link {
      display: inline-flex; align-items: center; gap: 0.4rem;
      font-family: "Space Mono", monospace; font-size: 0.75rem;
      letter-spacing: 0.15em; text-transform: uppercase;
      color: hsl(var(--foreground)); text-decoration: none;
      padding: 0.5rem 0.8rem; min-height: 40px;
      border: 2px solid hsl(var(--border)); background: hsl(var(--card));
      box-shadow: 3px 3px 0 hsl(var(--border));
    }
    .back-link:active { transform: translate(2px, 2px); box-shadow: none; }
    .game-container {
      background: hsl(var(--card)); color: hsl(var(--card-foreground));
      border: 3px solid hsl(var(--border)); box-shadow: var(--shadow-lg);
      padding: clamp(0.75rem, 2vw, 1.5rem);
      display: flex; flex-direction: column; align-items: center;
      gap: clamp(0.6rem, 1.5vw, 1rem); width: min(100%, 760px);
    }
    .game-container h1 {
      font-family: "DM Sans", sans-serif; font-weight: 700;
      font-size: clamp(1.25rem, 4vw, 1.875rem);
      letter-spacing: -0.02em; margin: 0; text-transform: uppercase;
    }
    .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.5rem; width: 100%; }
    .stat {
      border: 2px solid hsl(var(--border)); background: hsl(var(--card));
      padding: 0.4rem 0.5rem; text-align: center; box-shadow: 3px 3px 0 hsl(var(--border));
    }
    .stat label { display: block; font-family: "Space Mono", monospace; font-size: 0.58rem; letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.7; }
    .stat span { display: block; font-family: "Space Mono", monospace; font-size: clamp(0.9rem, 2.4vw, 1.25rem); font-weight: 700; margin-top: 0.15rem; }
    canvas#game {
      width: 100%; max-width: 720px; height: auto; aspect-ratio: 5 / 3;
      background: #0d1020; border: 3px solid hsl(var(--border));
      box-shadow: var(--shadow); touch-action: none; image-rendering: pixelated; display: block;
    }
    .game-container .retro-btn { width: 100%; max-width: 320px; }
    .hint { font-family: "Space Mono", monospace; font-size: 0.66rem; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.65; text-align: center; }

    /* Touch controls — left/right pad + jump */
    .touch { display: none; width: 100%; gap: 0.5rem; }
    .touch .pad { display: flex; gap: 0.5rem; }
    .touch .retro-btn.ctrl { min-height: 64px; font-size: 1.5rem; font-weight: 700; flex: 1; touch-action: manipulation; }
    .touch .jump { flex: 1.2; }
    @media (pointer: coarse) { .touch { display: flex; } }

    .message-box {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: hsl(var(--card)); color: hsl(var(--card-foreground));
      border: 3px solid hsl(var(--border)); box-shadow: var(--shadow-lg);
      padding: 1.75rem; text-align: center; z-index: 100; display: none;
      max-width: min(92%, 440px); width: 100%; font-family: "DM Sans", sans-serif;
    }
    .message-box h2 { margin: 0 0 0.5rem; font-size: 1.6rem; letter-spacing: -0.02em; }
    .message-box p { margin: 0 0 1.25rem; font-size: 1.05rem; line-height: 1.45; }
    .message-box .retro-btn { width: 100%; }
  </style>
</head>
<body>
  <header class="game-topbar">
    <a href="Gamelist.html" class="back-link">← Games</a>
    <button id="themeToggle" class="retro-icon-btn" title="Toggle Dark/Light Mode" aria-label="Toggle theme">🌙</button>
  </header>

  <div class="game-container">
    <h1>Cavern Dash</h1>
    <div class="stats-row">
      <div class="stat"><label>Level</label><span id="level">1</span></div>
      <div class="stat"><label>Gems</label><span id="gems">0/0</span></div>
      <div class="stat"><label>Lives</label><span id="lives">3</span></div>
      <div class="stat"><label>Score</label><span id="score">0</span></div>
    </div>
    <canvas id="game" width="600" height="360"></canvas>
    <button id="startButton" class="retro-btn retro-btn--primary">Start Game</button>
    <p class="hint">← → or A/D to move · ↑ / W / Space to jump · grab every gem + the 🏆, then reach the door 🚪</p>

    <div class="touch" aria-label="On-screen controls">
      <div class="pad">
        <button class="retro-btn ctrl" id="leftBtn" aria-label="Move left">◀</button>
        <button class="retro-btn ctrl" id="rightBtn" aria-label="Move right">▶</button>
      </div>
      <button class="retro-btn ctrl jump retro-btn--primary" id="jumpBtn" aria-label="Jump">JUMP ▲</button>
    </div>
  </div>

  <div id="messageBox" class="message-box">
    <h2 id="messageTitle">Cavern Dash</h2>
    <p id="messageText"></p>
    <button id="restartButton" class="retro-btn retro-btn--primary">Play</button>
  </div>

<script>
/* ================================================================
   CAVERN DASH — Simple Games
   ----------------------------------------------------------------
   A Dangerous-Dave-style pixel platformer. Every level shares the
   SAME tileset + look; layouts change and difficulty ramps (more
   gems, spikes, enemies, longer jumps). Collect all gems + the
   trophy, then reach the door to clear the level.

   Tiles (ASCII level maps):
     #  brick (solid)      =  one-way-ish platform (solid here)
     *  spike (deadly)     o  gem (collect)      T  trophy
     D  door / exit        @  player spawn       ^  enemy spawn
     (space) empty
   Pixel-art is drawn directly to the canvas (no image assets).
   ================================================================ */
(function () {
  "use strict";
  const TILE = 24;                       // world tile size in px (canvas units)
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  ctx.imageSmoothingEnabled = false;

  // ---- Blender-rendered 2.5D sprites. Loaded async; every draw call falls back
  // to the original flat pixel art until the image is ready, so the game never
  // shows blank. SPRITE_DATA may be injected (base64 data-URIs) by the offline
  // single-file build; otherwise we load from /games/sprites/*.png.
  const SPRITE_NAMES = [
    "brick", "spike", "door_locked", "door_open", "gem", "trophy",
    "hero_idle", "hero_run1", "hero_run2", "hero_jump",
    "enemy_idle", "enemy_walk1", "enemy_walk2",
  ];
  const IMG = {};
  const SPRITE_DATA = (typeof window !== "undefined" && window.__SPRITE_DATA__) || null;
  for (const n of SPRITE_NAMES) {
    const im = new Image();
    im.src = SPRITE_DATA ? SPRITE_DATA[n] : `sprites/${n}.png`;
    IMG[n] = im;
  }
  const has = (n) => IMG[n] && IMG[n].complete && IMG[n].naturalWidth > 0;
  // draw a sprite into a logical box (dw×dh) centred horizontally on (cx) with its
  // BOTTOM at (by); flipX mirrors for left-facing. Sprites are authored a bit
  // taller than their tile so 3D tops/overhangs read — we scale to fit the box.
  function spr(name, cx, by, dw, dh, flipX) {
    const im = IMG[name];
    ctx.save();
    ctx.translate(cx, by);
    if (flipX) ctx.scale(-1, 1);
    ctx.drawImage(im, -dw / 2, -dh, dw, dh);
    ctx.restore();
  }

  // ---- Level maps. All the same width (25) so the camera + look stay consistent.
  // Difficulty ramps: more spikes/enemies/gems, trickier jumps, later levels.
  const LEVELS = [
    [
      "#########################",
      "#@      o     o       W #",
      "#   ###    ##     ###   #",
      "#         o          o  #",
      "#  ###   ###  ^   ##     #",
      "#               ####   o#",
      "#  o   ^   ###          T#",
      "# ###     * *    ###  ####",
      "#      ###   ###        D#",
      "#####**###***###***##*####",
      "#########################",
    ],
    [
      "#########################",
      "#@   o    ^      o   o  T#",
      "# ##   ###   ###   ##  ##",
      "#   o        *        o  #",
      "#  ###  ^  ###  ###  ##  #",
      "#     *      o       *   #",
      "# ###   ###    ###  ### o#",
      "#   ^      **      ^     #",
      "# ##   ###   ###    ## ###",
      "#o  * *   o  * *  o  *  D#",
      "##**####***###***####**###",
      "#########################",
    ],
    [
      "#########################",
      "#@  o ^  o  ^  o  ^  o  T#",
      "###  ##  ##  ##  ##  ## ##",
      "#  *      *      *      o#",
      "# ### ^ ### ^ ### ^ ###  #",
      "#   o     o      o    *  #",
      "###  ## *  ## *  ## *  ###",
      "#  ^    o     o    ^   o #",
      "# ### ### ### ### ### ## #",
      "#o * * * o * * o * * * oD#",
      "##*##**##**##**##**##**###",
      "#########################",
    ],
  ];

  const COLS = LEVELS[0][0].length;
  const ROWS = LEVELS[0].length;
  // Camera viewport (in tiles) — world is wider/taller than the view on small screens.
  // Here world fits the 25×12 view at TILE=24 → 600×288; canvas is 600×360, scale to fit.
  canvas.width = COLS * TILE;            // 600
  canvas.height = ROWS * TILE;           // 288
  canvas.style.aspectRatio = COLS + " / " + ROWS;

  // ---- Game state
  let level = 0, lives = 3, score = 0;
  let running = false, ended = false;
  let solids, spikes, gems, trophy, door, enemies, player, gemsTotal, gemsGot, hasTrophy;
  let warps = [], inBonus = false;
  let keys = { left: false, right: false, jump: false };

  // Hidden bonus room reached via a 'W' warp pad (Dave-style secret). Loaded with
  // its own gems + a return pad 'R' that completes the level as a reward shortcut.
  const BONUS = [
    "#########################",
    "#   o o o o o o o o o    #",
    "#                        #",
    "#   ==================   #",
    "#    o o o o o o o o     #",
    "#                        #",
    "#   o o o      o o o     #",
    "#                        #",
    "#@      =======        R #",
    "####===####***####===####",
    "#########################",
  ];

  const el = {
    level: document.getElementById("level"),
    gems: document.getElementById("gems"),
    lives: document.getElementById("lives"),
    score: document.getElementById("score"),
    start: document.getElementById("startButton"),
    box: document.getElementById("messageBox"),
    title: document.getElementById("messageTitle"),
    text: document.getElementById("messageText"),
    restart: document.getElementById("restartButton"),
  };

  function loadLevel(i) {
    // i is a level index; loadMap() does the actual tile parsing so bonus rooms
    // (which aren't in LEVELS) can be loaded the same way.
    inBonus = false;
    loadMap(LEVELS[i]);
  }

  // Parse any tile map (main level or bonus room) into the live world.
  // Tiles: # brick · * spike · o gem · T trophy · D door · @ spawn · ^ enemy
  //        W hidden warp pad (→ bonus room) · R return pad (bonus → exit)
  function loadMap(map) {
    solids = []; spikes = []; gems = []; enemies = []; warps = [];
    trophy = null; door = null; hasTrophy = false; gemsGot = 0;
    for (let r = 0; r < map.length; r++) {
      for (let c = 0; c < map[r].length; c++) {
        const ch = map[r][c];
        const x = c * TILE, y = r * TILE;
        if (ch === "#" || ch === "=") solids.push({ x, y, w: TILE, h: TILE, kind: ch });
        else if (ch === "*") spikes.push({ x, y, w: TILE, h: TILE });
        else if (ch === "o") gems.push({ x: x + TILE / 2, y: y + TILE / 2, got: false });
        else if (ch === "T") trophy = { x: x + TILE / 2, y: y + TILE / 2, got: false };
        else if (ch === "D") door = { x, y, w: TILE, h: TILE };
        else if (ch === "@") player = makePlayer(x, y);
        else if (ch === "^") enemies.push(makeEnemy(x, y));
        else if (ch === "W") warps.push({ x: x + 4, y: y + 4, w: TILE - 8, h: TILE - 8, kind: "warp" });
        else if (ch === "R") warps.push({ x: x + 4, y: y + 4, w: TILE - 8, h: TILE - 8, kind: "return" });
      }
    }
    gemsTotal = gems.length;
    if (!player) player = makePlayer(TILE, TILE);
    updateHud();
  }

  // Enter the hidden bonus room (Dave-style warp). Remember the level to come
  // back to. The bonus has its own gems + a return pad that completes the level.
  function enterBonus() {
    inBonus = true;
    loadMap(BONUS);
    flash("✦ Secret Warp Zone ✦");
  }

  function makePlayer(x, y) {
    return { x: x + 3, y: y + 2, w: TILE - 6, h: TILE - 3, vx: 0, vy: 0, onGround: false, face: 1, animT: 0,
             coyote: 0, jumpBuf: 0, jumpHeld: false };
  }
  function makeEnemy(x, y) {
    return { x: x + 3, y: y + 4, w: TILE - 6, h: TILE - 6, dir: Math.random() < 0.5 ? -1 : 1, x0: x, animT: 0 };
  }

  // ---- Physics constants — tuned for a crisp "Dave"/Mario feel: snappy ground
  // accel, quick stop, a strong but controllable jump with variable height
  // (release early = shorter hop), plus coyote-time + jump-buffer so jumps near
  // edges / pressed just before landing still fire. Less air-float than before.
  const GRAV = 0.72, MOVE = 1.15, FRICTION = 0.70, MAXVX = 4.6, JUMP = 12.0, ENEMY_SPD = 1.1;
  const COYOTE_FRAMES = 6;     // can still jump this many frames after leaving ground
  const JUMPBUF_FRAMES = 6;    // a jump press is remembered this many frames
  const JUMP_CUT = 0.45;       // releasing jump while rising cuts upward velocity

  function aabb(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  function moveAxis(ent, dx, dy) {
    // move on X then Y, resolving against solids
    ent.x += dx;
    for (const s of solids) {
      if (aabb(ent, s)) {
        if (dx > 0) ent.x = s.x - ent.w;
        else if (dx < 0) ent.x = s.x + s.w;
        ent.vx = 0;
      }
    }
    ent.y += dy;
    ent.onGround = false;
    for (const s of solids) {
      if (aabb(ent, s)) {
        if (dy > 0) { ent.y = s.y - ent.h; ent.onGround = true; ent.vy = 0; }
        else if (dy < 0) { ent.y = s.y + s.h; ent.vy = 0; }
      }
    }
  }

  function step() {
    // input → player velocity
    if (keys.left) { player.vx -= MOVE; player.face = -1; }
    if (keys.right) { player.vx += MOVE; player.face = 1; }
    if (!keys.left && !keys.right) player.vx *= FRICTION;
    player.vx = Math.max(-MAXVX, Math.min(MAXVX, player.vx));

    // --- crisp jump: coyote-time + jump-buffer + variable height ---
    if (player.onGround) player.coyote = COYOTE_FRAMES; else if (player.coyote > 0) player.coyote--;
    // a fresh jump press fills the buffer (edge-detected against jumpHeld)
    if (keys.jump && !player.jumpHeld) player.jumpBuf = JUMPBUF_FRAMES;
    else if (player.jumpBuf > 0) player.jumpBuf--;
    player.jumpHeld = keys.jump;
    if (player.jumpBuf > 0 && player.coyote > 0) {
      player.vy = -JUMP; player.onGround = false; player.coyote = 0; player.jumpBuf = 0;
    }
    // release while rising → cut the jump short (tap = small hop, hold = full)
    if (!keys.jump && player.vy < 0) player.vy *= JUMP_CUT;

    player.vy += GRAV;
    player.vy = Math.min(player.vy, 16);
    moveAxis(player, player.vx, 0);
    moveAxis(player, 0, player.vy);
    player.animT += Math.abs(player.vx) * 0.2;

    // fell out of the world
    if (player.y > canvas.height + 40) return die("You fell into the dark.");

    // enemies patrol; reverse at walls/ledges
    for (const e of enemies) {
      e.x += e.dir * ENEMY_SPD;
      e.animT += 0.15;
      let hit = false;
      for (const s of solids) { if (aabb(e, s)) { hit = true; break; } }
      // ledge check: is there ground just ahead-below?
      const probe = { x: e.x + (e.dir > 0 ? e.w + 1 : -1), y: e.y + e.h + 2, w: 1, h: 2 };
      let ground = false;
      for (const s of solids) { if (aabb(probe, s)) { ground = true; break; } }
      if (hit || !ground) { e.dir *= -1; e.x += e.dir * (ENEMY_SPD + 1); }
      // collide with player
      if (aabb(player, e)) {
        // stomp: player falling onto enemy's head
        if (player.vy > 1 && player.y + player.h - e.y < 14) {
          e.dead = true; player.vy = -JUMP * 0.6; score += 50; updateHud();
        } else {
          return die("A critter got you.");
        }
      }
    }
    enemies = enemies.filter((e) => !e.dead);

    // spikes
    for (const sp of spikes) {
      if (aabb(player, { x: sp.x + 3, y: sp.y + 8, w: sp.w - 6, h: sp.h - 8 })) return die("Spikes!");
    }

    // gems
    for (const g of gems) {
      if (!g.got && Math.abs(player.x + player.w / 2 - g.x) < 16 && Math.abs(player.y + player.h / 2 - g.y) < 16) {
        g.got = true; gemsGot++; score += 25; updateHud();
      }
    }
    // trophy
    if (trophy && !trophy.got && Math.abs(player.x + player.w / 2 - trophy.x) < 18 && Math.abs(player.y + player.h / 2 - trophy.y) < 18) {
      trophy.got = true; hasTrophy = true; score += 100; updateHud();
    }
    // door — only when all gems + trophy collected
    if (door && gemsGot >= gemsTotal && (!trophy || hasTrophy) && aabb(player, door)) {
      return nextLevel();
    }

    // warp pads — 'W' (in a level) drops you into the secret bonus room; 'R' (in
    // the bonus room) banks the bonus gems and completes the level as a shortcut.
    for (const wp of warps) {
      if (aabb(player, wp)) {
        if (wp.kind === "warp" && !inBonus) { score += 50; return enterBonus(); }
        if (wp.kind === "return" && inBonus) { score += 150; return nextLevel(); }
      }
    }
  }

  function die(msg) {
    lives--; updateHud();
    if (lives <= 0) { running = false; ended = true; showBox("Game Over", msg + " No lives left. Final score " + score + ".", "Play again"); return; }
    // respawn at level start, keep collected progress
    const saveGems = gems.map((g) => g.got), saveTrophy = trophy ? trophy.got : false;
    const sgot = gemsGot, sscore = score;
    loadLevel(level);
    gems.forEach((g, i) => { if (saveGems[i]) g.got = true; });
    if (trophy) trophy.got = saveTrophy;
    hasTrophy = saveTrophy; gemsGot = sgot; score = sscore;
    updateHud();
    flash(msg);
  }

  let flashMsg = "", flashT = 0;
  function flash(m) { flashMsg = m; flashT = 90; }

  function nextLevel() {
    score += 200;
    if (level + 1 >= LEVELS.length) {
      running = false; ended = true;
      showBox("You Escaped!", "All caverns cleared. Final score " + score + ". A true cavern runner.", "Play again");
      return;
    }
    level++;
    loadLevel(level);
    flash("Level " + (level + 1));
  }

  function updateHud() {
    el.level.textContent = level + 1;
    el.gems.textContent = gemsGot + "/" + gemsTotal;
    el.lives.textContent = Math.max(0, lives);
    el.score.textContent = score;
  }

  // ---- Rendering (pixel art drawn directly) ----
  function px(x, y, w, h, color) { ctx.fillStyle = color; ctx.fillRect(x | 0, y | 0, w | 0, h | 0); }

  function drawBrick(x, y) {
    if (has("brick")) { spr("brick", x + TILE / 2, y + TILE, TILE, TILE, false); return; }
    px(x, y, TILE, TILE, "#5a4636");
    px(x, y, TILE, 3, "#6f5946");
    px(x, y + TILE / 2, TILE, 2, "#3c2f24");
    px(x + TILE / 2, y, 2, TILE / 2, "#3c2f24");
    px(x, y + TILE / 2, TILE / 4, 2, "#3c2f24");
    px(x + (TILE * 3) / 4, y + TILE / 2, TILE / 4, 2, "#3c2f24");
  }
  function drawSpike(x, y) {
    if (has("spike")) { spr("spike", x + TILE / 2, y + TILE, TILE, TILE, false); return; }
    px(x, y + TILE - 4, TILE, 4, "#444a55");
    ctx.fillStyle = "#c9ced8";
    for (let i = 0; i < 3; i++) {
      const bx = x + i * (TILE / 3);
      ctx.beginPath();
      ctx.moveTo(bx, y + TILE); ctx.lineTo(bx + TILE / 6, y + 6); ctx.lineTo(bx + TILE / 3, y + TILE);
      ctx.closePath(); ctx.fill();
    }
  }
  function drawGem(g) {
    if (g.got) return;
    const bob = Math.sin(Date.now() / 300 + g.x) * 2;
    if (has("gem")) { spr("gem", g.x, g.y + bob + 8, 16, 16, false); return; }
    const cx = g.x, cy = g.y + bob;
    ctx.fillStyle = "#28e0d0";
    ctx.beginPath();
    ctx.moveTo(cx, cy - 7); ctx.lineTo(cx + 6, cy); ctx.lineTo(cx, cy + 7); ctx.lineTo(cx - 6, cy);
    ctx.closePath(); ctx.fill();
    px(cx - 2, cy - 3, 2, 2, "#bafff7");
  }
  function drawTrophy(tr) {
    if (!tr || tr.got) return;
    const bob = Math.sin(Date.now() / 280) * 2, x = tr.x, y = tr.y + bob;
    if (has("trophy")) { spr("trophy", x, y + 11, 22, 22, false); return; }
    px(x - 7, y - 8, 14, 9, "#f0c020");
    px(x - 9, y - 7, 3, 5, "#f0c020"); px(x + 6, y - 7, 3, 5, "#f0c020");
    px(x - 3, y + 1, 6, 4, "#caa018"); px(x - 6, y + 5, 12, 3, "#caa018");
    px(x - 4, y - 6, 3, 3, "#fff3b0");
  }
  function drawDoor(d) {
    const open = gemsGot >= gemsTotal && (!trophy || hasTrophy);
    const name = open ? "door_open" : "door_locked";
    if (has(name)) {
      spr(name, d.x + TILE / 2, d.y + TILE, TILE + 4, TILE + 4, false);
      if (open) { // soft glow halo behind the open door
        ctx.save(); ctx.globalAlpha = 0.4 + Math.sin(Date.now() / 240) * 0.15;
        ctx.fillStyle = "rgba(120,255,180,0.6)";
        ctx.fillRect(d.x + 5, d.y + 4, TILE - 10, TILE - 5); ctx.restore();
      }
      return;
    }
    px(d.x + 3, d.y + 2, TILE - 6, TILE - 2, open ? "#2a6f4a" : "#3a3550");
    px(d.x + 3, d.y + 2, TILE - 6, 3, open ? "#3a8f60" : "#4a4566");
    if (open) { ctx.fillStyle = "rgba(120,255,180,0.5)"; ctx.fillRect(d.x + 6, d.y + 5, TILE - 12, TILE - 6); }
    else { px(d.x + TILE / 2 - 3, d.y + TILE / 2 - 2, 6, 6, "#f0c020"); }
  }
  function drawPlayer(p) {
    const x = p.x, y = p.y, f = p.face;
    // pick frame from state
    let frame = "hero_idle";
    if (!p.onGround) frame = "hero_jump";
    else if (Math.abs(p.vx) > 0.5) frame = (Math.floor(p.animT) % 2) ? "hero_run2" : "hero_run1";
    if (has(frame)) {
      // sprite drawn a touch taller than the body box so legs/cap read; bottom at feet
      const dw = p.w + 14, dh = p.h + 14;
      spr(frame, x + p.w / 2, y + p.h + 2, dw, dh, f < 0);
      return;
    }
    const stepF = p.onGround && Math.abs(p.vx) > 0.5 ? Math.floor(p.animT) % 2 : 0;
    px(x + 2, y + 8, p.w - 4, 7, "#d23b3b");
    px(x + 3, y + 15, 4, 4 + stepF, "#2d5bb0"); px(x + p.w - 7, y + 15, 4, 4 - stepF, "#2d5bb0");
    px(x + 4, y + 1, p.w - 8, 7, "#e8b890"); px(x + 4, y, p.w - 8, 3, "#7a4a28");
    px(f > 0 ? x + p.w - 7 : x + 4, y + 3, 2, 2, "#1a1a1a");
  }
  function drawEnemy(e) {
    const x = e.x, y = e.y;
    const frame = (Math.floor(e.animT) % 2) ? "enemy_walk1" : "enemy_walk2";
    if (has(frame)) { spr(frame, x + e.w / 2, y + e.h + 2, e.w + 10, e.h + 10, e.dir < 0); return; }
    const wob = Math.sin(e.animT) * 1.5;
    px(x, y + 2, e.w, e.h - 2, "#8a3ad0"); px(x + 1, y + wob, e.w - 2, 4, "#a050e0");
    px(x + 3, y + 6, 3, 3, "#fff"); px(x + e.w - 6, y + 6, 3, 3, "#fff");
    px(x + 4, y + 7, 2, 2, "#1a1a1a"); px(x + e.w - 5, y + 7, 2, 2, "#1a1a1a");
  }
  function drawWarp(wp) {
    // a pulsing swirl portal — return pads are warm gold, warp pads are violet
    const cx = wp.x + wp.w / 2, cy = wp.y + wp.h / 2;
    const t = Date.now() / 300;
    const ret = wp.kind === "return";
    const hue = ret ? "255,210,80" : "150,90,255";
    for (let r = 0; r < 3; r++) {
      const rad = 4 + r * 4 + (Math.sin(t + r) + 1) * 2;
      ctx.strokeStyle = `rgba(${hue},${0.7 - r * 0.2})`;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(cx, cy, rad, t + r, t + r + Math.PI * 1.5); ctx.stroke();
    }
    ctx.fillStyle = `rgba(${hue},0.9)`;
    ctx.beginPath(); ctx.arc(cx, cy, 2.5, 0, Math.PI * 2); ctx.fill();
  }

  function draw() {
    // cave background gradient + faint grid
    const g = ctx.createLinearGradient(0, 0, 0, canvas.height);
    g.addColorStop(0, "#141a2e"); g.addColorStop(1, "#0a0c16");
    ctx.fillStyle = g; ctx.fillRect(0, 0, canvas.width, canvas.height);
    for (const s of solids) drawBrick(s.x, s.y);
    for (const sp of spikes) drawSpike(sp.x, sp.y);
    for (const wp of warps) drawWarp(wp);
    for (const gem of gems) drawGem(gem);
    drawTrophy(trophy);
    if (door) drawDoor(door);
    for (const e of enemies) drawEnemy(e);
    if (player) drawPlayer(player);

    if (flashT > 0) {
      ctx.fillStyle = "rgba(0,0,0,0.55)";
      const bw = Math.min(canvas.width - 40, 320), bh = 44;
      ctx.fillRect((canvas.width - bw) / 2, canvas.height / 2 - bh / 2, bw, bh);
      ctx.fillStyle = "#fff"; ctx.font = "bold 18px 'DM Sans', sans-serif";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(flashMsg, canvas.width / 2, canvas.height / 2);
      flashT--;
    }
  }

  function loop() {
    if (running) step();
    draw();
    requestAnimationFrame(loop);
  }

  // ---- UI flow
  function showBox(title, text, btn) {
    el.title.textContent = title; el.text.textContent = text;
    el.restart.textContent = btn; el.box.style.display = "block";
  }
  function hideBox() { el.box.style.display = "none"; }

  function startGame() {
    level = 0; lives = 3; score = 0; ended = false;
    loadLevel(0); hideBox(); el.start.style.display = "none"; running = true;
    flash("Level 1");
  }

  el.start.addEventListener("click", startGame);
  el.restart.addEventListener("click", startGame);

  // ---- Input
  const keymap = {
    ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right",
    ArrowUp: "jump", KeyW: "jump", Space: "jump",
  };
  addEventListener("keydown", (e) => {
    const k = keymap[e.code]; if (!k) return;
    e.preventDefault(); keys[k] = true;
    if (!running && !ended && e.code === "Space") startGame();
  });
  addEventListener("keyup", (e) => { const k = keymap[e.code]; if (k) keys[k] = false; });

  function bindHold(id, key) {
    const b = document.getElementById(id);
    const on = (e) => { e.preventDefault(); keys[key] = true; };
    const off = (e) => { e.preventDefault(); keys[key] = false; };
    b.addEventListener("touchstart", on, { passive: false });
    b.addEventListener("touchend", off); b.addEventListener("touchcancel", off);
    b.addEventListener("mousedown", on); b.addEventListener("mouseup", off); b.addEventListener("mouseleave", off);
  }
  bindHold("leftBtn", "left"); bindHold("rightBtn", "right"); bindHold("jumpBtn", "jump");

  // ---- Theme toggle (matches the other games)
  (function () {
    const root = document.documentElement, t = document.getElementById("themeToggle");
    function apply(theme) {
      root.setAttribute("data-theme", theme);
      t.textContent = theme === "dark" ? "☀" : "🌙";
      try { localStorage.setItem("games-theme", theme); } catch (e) {}
      const m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute("content", theme === "dark" ? "#0a0a0a" : "#f5f5f0");
    }
    let saved; try { saved = localStorage.getItem("games-theme"); } catch (e) {}
    apply(saved === "dark" ? "dark" : "light");
    t.addEventListener("click", () => apply(root.getAttribute("data-theme") === "dark" ? "light" : "dark"));
  })();

  // first paint + idle attract
  loadLevel(0); running = false;
  showBox("Cavern Dash", "Grab every gem and the 🏆, then reach the door 🚪. Stomp critters, dodge spikes. Same cavern, three levels — each one nastier.", "Play");
  loop();
})();
</script>
</body>
</html>
