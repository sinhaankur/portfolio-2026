<!DOCTYPE html>
<html lang="en" data-mode="light">

  <title>Neon Memory — Simple Games</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f3f2f2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="icon" href="games-logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="css/arcade-frame.css" rel="stylesheet">
  <style>
    :root { --accent: #17b6c9; }
    html[data-mode="dark"] { --accent: #35e6ff; }

    .difficulty { flex: none; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 0 16px 8px; }
    .difficulty button { min-height: 40px; border: 2px solid var(--rule); background: transparent; color: var(--fg);
      border-radius: 10px; font: 700 11px Archivo, sans-serif; letter-spacing: .04em; text-transform: uppercase; cursor: pointer; }
    .difficulty button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }

    .board { display: grid; gap: 8px; width: 100%; max-height: 100%; perspective: 900px;
      background: radial-gradient(circle at 50% 30%, #0d1330, #060815);
      border: 2px solid rgba(90,150,255,.15); border-radius: 14px; padding: 12px;
      box-shadow: inset 0 0 30px rgba(20,40,120,.4); }
    .card { position: relative; aspect-ratio: 1/1; cursor: pointer; transform-style: preserve-3d;
      transition: transform .5s cubic-bezier(.34,1.56,.64,1); }
    .card.flipped, .card.matched { transform: rotateY(180deg); }
    .card.matched { cursor: default; }
    .card-face { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      border-radius: 12px; font-weight: 700; font-size: clamp(1.3rem, 7vw, 2.2rem);
      backface-visibility: hidden; -webkit-backface-visibility: hidden; overflow: hidden; }
    .card-face.front { background: radial-gradient(circle at 50% 40%, #182352, #0a0e24);
      border: 2px solid rgba(90,150,255,.35); box-shadow: inset 0 0 18px rgba(60,120,255,.25); color: #6fa0ff; }
    .card-face.front::after { content: "◆"; font-size: 1.4em; color: #4a78ff; text-shadow: 0 0 12px #4a78ff; opacity: .85; }
    .card-face.back { transform: rotateY(180deg); background: radial-gradient(circle at 50% 35%, #1a2547, #0b1024);
      border: 2px solid var(--accent-color, #3affc0); box-shadow: inset 0 0 20px rgba(58,255,192,.2), 0 0 16px var(--accent-color, #3affc0);
      color: #fff; text-shadow: 0 0 10px var(--accent-color, #3affc0); }
    .card.matched .card-face.back { animation: cardMatch .6s ease; }
    @keyframes cardMatch { 0% { transform: rotateY(180deg) scale(1); } 40% { transform: rotateY(180deg) scale(1.14); } 100% { transform: rotateY(180deg) scale(1); } }
    .board-wrap { padding: 4px 16px 10px; }
  </style>
</head>
<body>
  <div id="app">
    <div id="frame">
      <div class="topbar">
        <a class="back" href="Gamelist.html">← Games</a>
        <span class="title">Neon Memory</span>
        <div class="btns">
          <button class="icon-btn" id="gazeBtn" aria-label="Eye control">👁</button>
          <button class="icon-btn" id="themeBtn" aria-label="Toggle theme">◐</button>
          <button class="icon-btn" id="restartBtn" aria-label="New game">↻</button>
        </div>
      </div>

      <div class="hud">
        <div class="stat">
          <div class="label">Moves</div>
          <div class="score" id="moves">0</div>
          <div id="eyeHost" style="margin-top:4px"></div>
        </div>
        <div class="stat right">
          <div class="label">Pairs</div>
          <div class="best" id="pairs">0</div>
          <div class="label" style="margin-top:4px">Time · Best</div>
          <div class="best"><span id="time">0:00</span> · <span id="best">—</span></div>
        </div>
      </div>

      <div class="difficulty" role="tablist" aria-label="Difficulty">
        <button data-diff="easy" aria-pressed="true">Easy 4×3</button>
        <button data-diff="medium" aria-pressed="false">Med 4×4</button>
        <button data-diff="hard" aria-pressed="false">Hard 6×4</button>
      </div>

      <div class="board-wrap">
        <div id="board" class="board" aria-label="Card board"></div>
      </div>

      <div class="controls">
        <div class="hint">Match every pair in as few moves as you can.</div>
        <button class="btn-primary" id="startBtn">NEW GAME</button>
      </div>

      <div id="gazeNote"></div>
      <div id="gazeDot"></div>

      <div id="over">
        <div class="card" style="all:unset; display:block; width:100%; max-width:300px;">
          <div style="background:var(--bg);color:var(--fg);border-radius:18px;padding:26px 22px;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.4)">
            <h2 id="overTitle">All matched!</h2>
            <div class="big" id="overScore">0</div>
            <div class="note" id="overNote"></div>
            <button id="playAgain">PLAY AGAIN</button>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
/* ================================================================
   NEON MEMORY — Simple Games (shared arcade frame)
   Match the pairs. 3 difficulties. Best (fewest moves, fastest
   tie-break) per difficulty saved locally.
   ================================================================ */
var store = {
  get: function (k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } },
  set: function (k, v) { try { window.localStorage.setItem(k, v); } catch (e) {} },
};
var EMOJI_POOL = ['🦊','🐯','🐻','🐼','🐨','🐶','🦁','🐸','🦄','🐙','🦋','🐝','🐌','🐳','🦖','🦉','🦩','🦚','🐉','🐢'];
var DIFF = { easy: { cols: 4, rows: 3 }, medium: { cols: 4, rows: 4 }, hard: { cols: 6, rows: 4 } };

var audioCtx = null;
function beep(freq, dur, type, vol) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    var o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type || 'sine'; o.frequency.value = freq; g.gain.value = vol || .05;
    o.connect(g); g.connect(audioCtx.destination); o.start();
    g.gain.exponentialRampToValueAtTime(.0001, audioCtx.currentTime + (dur || .08));
    o.stop(audioCtx.currentTime + (dur || .08));
  } catch (e) {}
}
function winFanfare() { [523, 659, 784, 1047].forEach(function (f, i) { setTimeout(function () { beep(f, .16, 'sine', .06); }, i * 110); }); }

var boardEl = document.getElementById('board');
var movesEl = document.getElementById('moves'), pairsEl = document.getElementById('pairs');
var timeEl = document.getElementById('time'), bestEl = document.getElementById('best');
var overEl = document.getElementById('over'), overTitle = document.getElementById('overTitle');
var overScore = document.getElementById('overScore'), overNote = document.getElementById('overNote');

var cards = [], selected = [], lock = false, moves = 0, matched = 0, totalPairs = 0;
var difficulty = 'easy', startedAt = 0, elapsedMs = 0, timerRAF = null, won = false;
var eyeFace = null;

/* theme */
function setTheme(m) {
  document.documentElement.setAttribute('data-mode', m);
  store.set('memTheme', m);
  var meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', m === 'dark' ? '#171615' : '#f3f2f2');
}
setTheme(store.get('memTheme') || 'light');
document.getElementById('themeBtn').addEventListener('click', function () {
  setTheme(document.documentElement.getAttribute('data-mode') === 'dark' ? 'light' : 'dark');
});

function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var tmp = a[i]; a[i] = a[j]; a[j] = tmp; }
  return a;
}
function fmt(ms) { var t = Math.floor(ms / 1000); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); }
function bestKey() { return 'memBest:' + difficulty; }
function loadBest() { try { var r = store.get(bestKey()); return r ? JSON.parse(r) : null; } catch (e) { return null; } }
function saveBest(rec) { store.set(bestKey(), JSON.stringify(rec)); }
function updateBest() { var b = loadBest(); bestEl.textContent = b ? (b.moves + 'm ' + fmt(b.timeMs)) : '—'; }

function build() {
  var d = DIFF[difficulty], pairCount = (d.cols * d.rows) / 2;
  totalPairs = pairCount;
  var pool = shuffle(EMOJI_POOL).slice(0, pairCount);
  var deck = shuffle(pool.concat(pool));
  cards = deck.map(function (e, idx) { return { id: idx, emoji: e, matched: false, flipped: false }; });
  selected = []; lock = false; moves = 0; matched = 0; won = false; elapsedMs = 0; startedAt = 0;
  movesEl.textContent = '0'; pairsEl.textContent = '0/' + pairCount; timeEl.textContent = '0:00';
  boardEl.style.gridTemplateColumns = 'repeat(' + d.cols + ', 1fr)';
  boardEl.innerHTML = '';
  var pairHue = {};
  pool.forEach(function (e, i) { pairHue[e] = Math.round((i / pool.length) * 360); });
  cards.forEach(function (card) {
    var el = document.createElement('button');
    el.type = 'button'; el.className = 'card'; el.dataset.id = card.id;
    el.setAttribute('aria-label', 'Hidden card');
    el.style.setProperty('--accent-color', 'hsl(' + (pairHue[card.emoji] || 160) + ', 90%, 62%)');
    el.innerHTML = '<span class="card-face back">' + card.emoji + '</span><span class="card-face front">?</span>';
    el.addEventListener('click', function () { onCard(card, el); });
    boardEl.appendChild(el);
  });
  updateBest(); overEl.classList.remove('show');
  if (eyeFace && window.MatesEyes) MatesEyes.mood(eyeFace, 'idle');
}

function onCard(card, el) {
  if (lock || card.flipped || card.matched || won) return;
  if (!startedAt) startTimer();
  card.flipped = true; el.classList.add('flipped'); beep(440, .05, 'triangle', .04);
  selected.push({ card: card, el: el });
  if (selected.length === 2) {
    moves++; movesEl.textContent = moves;
    var a = selected[0], b = selected[1];
    if (a.card.emoji === b.card.emoji) {
      a.card.matched = b.card.matched = true; a.el.classList.add('matched'); b.el.classList.add('matched');
      selected = []; matched++; pairsEl.textContent = matched + '/' + totalPairs;
      beep(660, .08, 'sine', .06); setTimeout(function () { beep(880, .12, 'sine', .055); }, 80);
      if (matched === totalPairs) finish();
    } else {
      beep(200, .12, 'sawtooth', .04); lock = true;
      setTimeout(function () {
        a.card.flipped = b.card.flipped = false;
        a.el.classList.remove('flipped'); b.el.classList.remove('flipped');
        selected = []; lock = false;
      }, 700);
    }
  }
}

function startTimer() {
  startedAt = performance.now(); var lastT = startedAt;
  (function tick(t) {
    if (won) return;
    elapsedMs += Math.min(t - lastT, 250); lastT = t;
    timeEl.textContent = fmt(elapsedMs);
    timerRAF = requestAnimationFrame(tick);
  })(startedAt);
}

function finish() {
  won = true; winFanfare();
  if (timerRAF) cancelAnimationFrame(timerRAF);
  var best = loadBest(), rec = { moves: moves, timeMs: Math.floor(elapsedMs) };
  var isBest = !best || rec.moves < best.moves || (rec.moves === best.moves && rec.timeMs < best.timeMs);
  if (isBest) saveBest(rec);
  overTitle.textContent = isBest ? 'New personal best!' : 'All matched!';
  overScore.textContent = moves + ' moves';
  overNote.textContent = 'Cleared the ' + difficulty + ' board in ' + fmt(elapsedMs) + '.';
  overEl.classList.add('show');
  if (eyeFace && window.MatesEyes) MatesEyes.mood(eyeFace, 'happy');
  updateBest();
}

function setDifficulty(diff) {
  difficulty = diff;
  document.querySelectorAll('.difficulty button').forEach(function (b) {
    b.setAttribute('aria-pressed', String(b.dataset.diff === diff));
  });
  if (timerRAF) cancelAnimationFrame(timerRAF);
  build();
}
document.querySelectorAll('.difficulty button').forEach(function (b) {
  b.addEventListener('click', function () { setDifficulty(b.dataset.diff); });
});
document.getElementById('startBtn').addEventListener('click', function () { if (timerRAF) cancelAnimationFrame(timerRAF); build(); });
document.getElementById('restartBtn').addEventListener('click', function () { if (timerRAF) cancelAnimationFrame(timerRAF); build(); });
document.getElementById('playAgain').addEventListener('click', function () { if (timerRAF) cancelAnimationFrame(timerRAF); build(); });

/* cute eyes on the move counter */
if (window.MatesEyes) eyeFace = MatesEyes.make(document.getElementById('eyeHost'));

/* opt-in gaze: cursor over the board, smile flips the card under the cursor */
var gazeBtn = document.getElementById('gazeBtn');
var gazeNote = document.getElementById('gazeNote'), gazeDot = document.getElementById('gazeDot');
var gazePt = null;
function showNote(msg) { gazeNote.textContent = msg; gazeNote.classList.add('show'); setTimeout(function () { gazeNote.classList.remove('show'); }, 2600); }
if (window.GazeControl) {
  GazeControl.attach({
    onMove: function (xn, yn) {
      var r = boardEl.getBoundingClientRect();
      var cx = r.left + xn * r.width, cy = r.top + yn * r.height;
      gazePt = { x: cx, y: cy };
      gazeDot.style.left = cx + 'px'; gazeDot.style.top = cy + 'px';
      window.MatesEyes && MatesEyes.track(cx, cy);
    },
    onSmile: function () {
      if (!gazePt) return;
      var el = document.elementFromPoint(gazePt.x, gazePt.y);
      var card = el && el.closest ? el.closest('.card') : null;
      if (card) card.click();
    },
    onStatus: function (msg, ok) { showNote(msg); gazeBtn.classList.toggle('on', ok && GazeControl.active); },
  });
  gazeBtn.addEventListener('click', function () {
    GazeControl.toggle();
    setTimeout(function () { var on = GazeControl.active; gazeBtn.classList.toggle('on', on); gazeDot.classList.toggle('on', on); }, 400);
  });
} else { gazeBtn.style.display = 'none'; }

/* boot */
setDifficulty('easy');
</script>
  <script src="js/mates-eyes.js" defer></script>
  <script src="js/gaze-control.js" defer></script>
  <script src="js/fullscreen.js" defer></script>
</body>
</html>
