<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <title>Neon Snake — Simple Games</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f0">
  <link rel="icon" href="games-logo.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link href="css/retro.css" rel="stylesheet">
  <style>
    html, body { margin: 0; min-height: 100dvh; overflow-x: hidden; }
    body {
      display: flex; flex-direction: column; align-items: center; gap: 0.75rem;
      padding:
        max(0.75rem, env(safe-area-inset-top))
        max(0.75rem, env(safe-area-inset-right))
        max(0.75rem, env(safe-area-inset-bottom))
        max(0.75rem, env(safe-area-inset-left));
    }
    .game-topbar {
      width: min(100%, 720px);
      display: flex; align-items: center; justify-content: space-between; gap: 0.5rem;
    }
    .back-link {
      display: inline-flex; align-items: center; gap: 0.4rem;
      font-family: "Space Mono", monospace; font-size: 0.75rem;
      letter-spacing: 0.15em; text-transform: uppercase;
      color: hsl(var(--foreground)); text-decoration: none;
      padding: 0.5rem 0.8rem; min-height: 40px;
      border: 2px solid hsl(var(--border));
      background: hsl(var(--card));
      box-shadow: 3px 3px 0 hsl(var(--border));
    }
    .back-link:active { transform: translate(2px, 2px); box-shadow: none; }
    .game-container {
      background: hsl(var(--card));
      color: hsl(var(--card-foreground));
      border: 3px solid hsl(var(--border));
      box-shadow: var(--shadow-lg);
      padding: clamp(0.75rem, 2vw, 1.5rem);
      display: flex; flex-direction: column; align-items: center;
      gap: clamp(0.6rem, 1.5vw, 1rem);
      width: min(100%, 560px);
    }
    .game-container h1 {
      font-family: "DM Sans", sans-serif; font-weight: 700;
      font-size: clamp(1.25rem, 4vw, 1.875rem);
      letter-spacing: -0.02em; margin: 0; text-transform: uppercase;
    }
    .stats-row {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; width: 100%;
    }
    .stat {
      border: 2px solid hsl(var(--border)); background: hsl(var(--card));
      padding: 0.4rem 0.5rem; text-align: center;
      box-shadow: 3px 3px 0 hsl(var(--border));
    }
    .stat label {
      display: block; font-family: "Space Mono", monospace; font-size: 0.6rem;
      letter-spacing: 0.15em; text-transform: uppercase; opacity: 0.7;
    }
    .stat span {
      display: block; font-family: "Space Mono", monospace;
      font-size: clamp(0.95rem, 2.4vw, 1.3rem); font-weight: 700; margin-top: 0.15rem;
    }
    canvas#game {
      /* HEIGHT-AWARE: the square board is capped by BOTH the column width and a
         viewport-height budget, so on phones the START button + D-pad always
         stay above the fold (the vh cap wins on tall phones). */
      --board-h-budget: 52dvh;
      width: min(100%, 480px, var(--board-h-budget)); height: auto; aspect-ratio: 1 / 1;
      /* the neon board is drawn dark in-canvas; keep a dark frame + glow so it
         reads as an arcade screen in either theme. */
      background: #060815; border: 3px solid hsl(var(--border));
      box-shadow: var(--shadow), 0 0 30px rgba(60,255,192,0.15);
      touch-action: none; display: block; margin: 0 auto;
    }
    /* Phone one-screen fit: trim vertical rhythm so the D-pad never clips. */
    @media (pointer: coarse), (max-height: 780px) {
      body { gap: 0.5rem; }
      .game-container { gap: 0.5rem; padding: 0.75rem; }
      canvas#game { --board-h-budget: 48dvh; }
      .controls .ctrl { min-height: 48px; }
      .controls-toggle { display: none; }
    }
    @media (max-height: 680px) and (orientation: portrait) {
      canvas#game { --board-h-budget: 44dvh; }
    }
    .game-container .retro-btn { width: 100%; }
    .controls {
      display: grid; grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(2, auto);
      gap: 0.4rem; width: 100%;
    }
    .controls .ctrl {
      min-height: 52px; font-size: 1.15rem; font-weight: 700;
      padding: 0.5rem 0.3rem; touch-action: manipulation;
    }
    .controls .ctrl-empty { visibility: hidden; }
    @media (pointer: fine) {
      .controls { display: none; }
      .controls.show { display: grid; }
    }
    .controls-toggle {
      font-family: "Space Mono", monospace; font-size: 0.65rem;
      letter-spacing: 0.18em; text-transform: uppercase;
      background: none; border: 0; color: hsl(var(--foreground));
      opacity: 0.6; cursor: pointer; padding: 0.25rem 0;
    }
    .controls-toggle:hover { opacity: 1; }
    @media (pointer: coarse) { .controls-toggle { display: none; } }
    .message-box {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: hsl(var(--card)); color: hsl(var(--card-foreground));
      border: 3px solid hsl(var(--border)); box-shadow: var(--shadow-lg);
      padding: 1.75rem; text-align: center; z-index: 100; display: none;
      max-width: min(90%, 420px); width: 100%; font-family: "DM Sans", sans-serif;
    }
    .message-box h2 { margin: 0 0 0.5rem 0; font-size: 1.5rem; letter-spacing: -0.02em; }
    .message-box p { margin: 0 0 1.25rem 0; font-size: 1.1rem; line-height: 1.4; }
    .message-box .stat-list {
      display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;
      margin: 0 0 1.25rem; text-align: left;
    }
    .message-box .retro-btn { width: 100%; }
  </style>
</head>
<body>
  <header class="game-topbar">
    <a href="Gamelist.html" class="back-link">← Games</a>
    <button id="themeToggle" class="retro-icon-btn" title="Toggle Dark/Light Mode" aria-label="Toggle theme">🌙</button>
  </header>

  <div class="game-container">
    <h1>Neon Snake</h1>
    <div class="stats-row">
      <div class="stat"><label>Score</label><span id="score">0</span></div>
      <div class="stat"><label>Length</label><span id="lengthEl">3</span></div>
      <div class="stat"><label>High</label><span id="high">0</span></div>
    </div>
    <canvas id="game" width="480" height="480"></canvas>
    <button id="startButton" class="retro-btn retro-btn--primary">Start Game</button>
    <button id="controlsToggle" class="controls-toggle" type="button">Show on-screen controls</button>

    <div class="controls" id="controls" aria-label="On-screen controls">
      <div class="ctrl-empty"></div>
      <button class="retro-btn ctrl" id="upBtn" aria-label="Up">▲</button>
      <div class="ctrl-empty"></div>
      <button class="retro-btn ctrl" id="leftBtn" aria-label="Left">◀</button>
      <button class="retro-btn ctrl" id="downBtn" aria-label="Down">▼</button>
      <button class="retro-btn ctrl" id="rightBtn" aria-label="Right">▶</button>
    </div>
  </div>

  <div id="messageBox" class="message-box">
    <h2 id="messageTitle">Game Over</h2>
    <p id="messageText"></p>
    <div class="stat-list">
      <div class="stat"><label>Score</label><span id="finalScore">0</span></div>
      <div class="stat"><label>Length</label><span id="finalLength">3</span></div>
    </div>
    <button id="restartButton" class="retro-btn retro-btn--primary">Play again</button>
  </div>

<script>
/* ================================================================
   NEON SNAKE — Simple Games
   ----------------------------------------------------------------
   20x20 grid. Snake starts at length 3 in the middle, food spawns
   at a random empty cell. Eat food → +1 length, +10 × level points.
   Speed increases gradually with score (level = floor(score/100) + 1).
   ================================================================ */
/* Safe storage — iOS Safari Private Mode / strict privacy settings throw a
   SecurityError on any localStorage access. A bare read at module top used to
   kill the whole script (and therefore ALL controls) on those phones. Route
   every localStorage call through these guards so the game always runs. */
const store = {
  get(k) { try { return store.get(k); } catch { return null; } },
  set(k, v) { try { store.set(k, v); } catch { /* private mode */ } },
};
const COLS = 20;
const ROWS = 20;
const FOOD_EMOJIS = ['🍎','🍓','🍒','🍇','🍌','🥝','🍑','🍍','🍋','🥭'];
const SNAKE_HEAD = '😀';
const SNAKE_BODY = '🟢';

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const lengthEl = document.getElementById('lengthEl');
const highEl = document.getElementById('high');
const startButton = document.getElementById('startButton');
const restartButton = document.getElementById('restartButton');
const messageBox = document.getElementById('messageBox');
const messageTitle = document.getElementById('messageTitle');
const messageText = document.getElementById('messageText');
const finalScore = document.getElementById('finalScore');
const finalLength = document.getElementById('finalLength');
const controlsEl = document.getElementById('controls');
const controlsToggle = document.getElementById('controlsToggle');

let snake = [];
let dir = { x: 1, y: 0 };
let queuedDir = null;
let food = null;
let foodEmoji = '🍎';
let score = 0;
let highScore = Number(store.get('emojiSnakeHigh') || 0);
let running = false;
let gameOver = false;
let lastStepTime = 0;
let stepInterval = 140;
let rAF = null;

function cellPx() { return canvas.width / COLS; }

function initTheme() {
  const saved = store.get('emojiSnakeTheme') || 'light';
  setTheme(saved);
  document.getElementById('themeToggle').addEventListener('click', () => {
    setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });
}
function setTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  document.documentElement.style.colorScheme = t;
  store.set('emojiSnakeTheme', t);
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', t === 'dark' ? '#0a0a0a' : '#f5f5f0');
  const btn = document.getElementById('themeToggle');
  btn.textContent = t === 'dark' ? '☀️' : '🌙';
}

function placeFood() {
  const occupied = new Set(snake.map(s => `${s.x},${s.y}`));
  const empties = [];
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      if (!occupied.has(`${x},${y}`)) empties.push({ x, y });
    }
  }
  if (empties.length === 0) {
    // Board filled — win.
    return finishGame('You filled the board!');
  }
  food = empties[Math.floor(Math.random() * empties.length)];
  foodEmoji = FOOD_EMOJIS[Math.floor(Math.random() * FOOD_EMOJIS.length)];
}

function updateHud() {
  scoreEl.textContent = score;
  lengthEl.textContent = snake.length;
  highEl.textContent = highScore;
}

/* ── NEON JUICE ── original particle + shake systems for the arcade glow-up ── */
let particles = [];
let shake = 0;               // screen-shake magnitude, decays each frame
let renderTime = 0;          // for pulsing / animated effects
let prevSnake = [];          // last step's positions, for smooth interpolation
let stepProgress = 1;        // 0→1 between logic steps (visual interpolation)

function spawnBurst(cx, cy, hue, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 1.5 + Math.random() * 3.5;
    particles.push({
      x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: 1, hue: hue + (Math.random() * 40 - 20), size: 2 + Math.random() * 3,
    });
  }
}

function updateParticles(dt) {
  for (const p of particles) {
    p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.vx *= 0.94; p.vy *= 0.94;
    p.life -= dt * 1.8;
  }
  particles = particles.filter(p => p.life > 0);
}

// Snake body colour = a neon gradient that shifts along its length.
function segColor(i, n, alpha) {
  const hue = (150 + i / Math.max(1, n) * 90) % 360; // green→cyan→blue along body
  return `hsla(${hue}, 90%, ${60 - i / n * 10}%, ${alpha})`;
}

function draw() {
  const px = cellPx();
  const W = canvas.width, H = canvas.height;
  ctx.save();

  // screen shake
  if (shake > 0.1) {
    ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    shake *= 0.85;
  }

  // deep arcade board with a subtle vignette
  const bg = ctx.createRadialGradient(W / 2, H / 2, H * 0.1, W / 2, H / 2, H * 0.75);
  bg.addColorStop(0, '#0d1330');
  bg.addColorStop(1, '#050615');
  ctx.fillStyle = bg;
  ctx.fillRect(-40, -40, W + 80, H + 80);

  // glowing grid lines
  ctx.strokeStyle = 'rgba(90,140,255,0.08)';
  ctx.lineWidth = 1;
  for (let i = 1; i < COLS; i++) {
    ctx.beginPath(); ctx.moveTo(i * px, 0); ctx.lineTo(i * px, H); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i * px); ctx.lineTo(W, i * px); ctx.stroke();
  }

  // ── food: a pulsing glowing orb ──
  if (food) {
    const fx = food.x * px + px / 2, fy = food.y * px + px / 2;
    const pulse = 0.5 + Math.sin(renderTime * 6) * 0.5;
    ctx.save();
    ctx.shadowColor = '#ff5a8a'; ctx.shadowBlur = 18 + pulse * 14;
    const grad = ctx.createRadialGradient(fx, fy, 1, fx, fy, px * 0.5);
    grad.addColorStop(0, '#ffd0e0'); grad.addColorStop(0.5, '#ff5a8a'); grad.addColorStop(1, '#c01858');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(fx, fy, px * (0.32 + pulse * 0.06), 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // ── snake: glowing rounded body with interpolated motion + head eyes ──
  const n = snake.length;
  const t = stepProgress;
  const lerp = (a, b) => a + (b - a) * t;
  ctx.save();
  ctx.shadowColor = '#3affc0'; ctx.shadowBlur = 12;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  // draw as a thick connected path for a smooth ribbon body
  const pts = snake.map((seg, i) => {
    const prev = prevSnake[i] || seg;
    return {
      x: lerp(prev.x, seg.x) * px + px / 2,
      y: lerp(prev.y, seg.y) * px + px / 2,
    };
  });
  if (pts.length > 1) {
    for (let i = pts.length - 1; i > 0; i--) {
      ctx.strokeStyle = segColor(i, n, 0.95);
      ctx.lineWidth = px * (0.82 - i / n * 0.18);
      ctx.beginPath(); ctx.moveTo(pts[i].x, pts[i].y); ctx.lineTo(pts[i - 1].x, pts[i - 1].y); ctx.stroke();
    }
  }
  // head cap + eyes
  const head = pts[0];
  ctx.fillStyle = segColor(0, n, 1);
  ctx.beginPath(); ctx.arc(head.x, head.y, px * 0.42, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;
  const ex = dir.x * px * 0.14, ey = dir.y * px * 0.14;
  const perpX = -dir.y * px * 0.16, perpY = dir.x * px * 0.16;
  ctx.fillStyle = '#04121a';
  for (const s of [1, -1]) {
    ctx.beginPath();
    ctx.arc(head.x + ex + perpX * s, head.y + ey + perpY * s, px * 0.08, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();

  // ── particles ──
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = `hsl(${p.hue}, 95%, 62%)`;
    ctx.shadowColor = `hsl(${p.hue}, 95%, 62%)`; ctx.shadowBlur = 8;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  ctx.restore();
}

function step() {
  if (queuedDir) { dir = queuedDir; queuedDir = null; }
  const head = snake[0];
  const next = { x: head.x + dir.x, y: head.y + dir.y };

  // Wall collision
  if (next.x < 0 || next.x >= COLS || next.y < 0 || next.y >= ROWS) {
    return finishGame('Hit a wall.');
  }
  // Self collision (allow the tail tip since it moves away)
  for (let i = 0; i < snake.length - 1; i++) {
    if (snake[i].x === next.x && snake[i].y === next.y) {
      return finishGame('Bit yourself.');
    }
  }
  snake.unshift(next);
  if (food && next.x === food.x && next.y === food.y) {
    const level = Math.floor(score / 100) + 1;
    score += 10 * level;
    // Speed increases gently: 4 ms faster per food eaten, floor at 55 ms.
    stepInterval = Math.max(55, stepInterval - 4);
    // JUICE: burst of pink particles at the food, a little shake, chime.
    const px = cellPx();
    spawnBurst(food.x * px + px / 2, food.y * px + px / 2, 330, 18);
    shake = Math.min(10, shake + 5);
    beep(660 + Math.min(score, 600), 0.06, 'square', 0.05);
    placeFood();
    updateHud();
  } else {
    snake.pop();
  }
}

/* Tiny WebAudio blip so eating + dying have feedback (no asset files). */
let audioCtx = null;
function beep(freq, dur, type, vol) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type || 'sine'; o.frequency.value = freq;
    g.gain.value = vol || 0.05;
    o.connect(g); g.connect(audioCtx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + (dur || 0.08));
    o.stop(audioCtx.currentTime + (dur || 0.08));
  } catch (e) { /* audio optional */ }
}

function finishGame(reason) {
  running = false;
  gameOver = true;
  // JUICE: death burst at the head + a hard shake + a descending tone.
  if (snake.length) {
    const px = cellPx();
    spawnBurst(snake[0].x * px + px / 2, snake[0].y * px + px / 2, 10, 30);
    shake = 16;
    beep(200, 0.25, 'sawtooth', 0.08);
    setTimeout(() => beep(120, 0.3, 'sawtooth', 0.06), 90);
  }
  cancelAnimationFrame(rAF);
  // keep animating the death particles + shake for a moment before stopping
  const deathStart = performance.now();
  const deathAnim = (t) => {
    updateParticles(1 / 60); draw();
    if (t - deathStart < 800) requestAnimationFrame(deathAnim);
  };
  requestAnimationFrame(deathAnim);
  rAF = null;
  if (score > highScore) {
    highScore = score;
    store.set('emojiSnakeHigh', String(highScore));
  }
  finalScore.textContent = score;
  finalLength.textContent = snake.length;
  messageTitle.textContent = score === highScore && score > 0 ? 'New high score!' : 'Game over';
  messageText.textContent = reason;
  messageBox.style.display = 'block';
  startButton.style.display = 'block';
  startButton.textContent = 'Play again';
  draw();
  updateHud();
}

function loop(time) {
  rAF = requestAnimationFrame(loop);
  renderTime = time / 1000;
  // continuous visual updates (particles + interpolation) even between steps
  if (running) {
    stepProgress = Math.min(1, (time - lastStepTime) / stepInterval);
    if (time - lastStepTime >= stepInterval) {
      lastStepTime = time;
      prevSnake = snake.map(s => ({ x: s.x, y: s.y }));
      step();
      stepProgress = 0;
    }
  }
  updateParticles(1 / 60);
  draw();
}

function startGame() {
  snake = [
    { x: Math.floor(COLS / 2),     y: Math.floor(ROWS / 2) },
    { x: Math.floor(COLS / 2) - 1, y: Math.floor(ROWS / 2) },
    { x: Math.floor(COLS / 2) - 2, y: Math.floor(ROWS / 2) },
  ];
  dir = { x: 1, y: 0 };
  queuedDir = null;
  score = 0;
  stepInterval = 140;
  particles = [];
  shake = 0;
  prevSnake = snake.map(s => ({ x: s.x, y: s.y }));
  stepProgress = 1;
  placeFood();
  updateHud();
  running = true;
  gameOver = false;
  messageBox.style.display = 'none';
  startButton.style.display = 'none';
  lastStepTime = performance.now();
  if (rAF) cancelAnimationFrame(rAF);
  rAF = requestAnimationFrame(loop);
}

function trySetDir(nx, ny) {
  // Block 180° turns into the snake's own body.
  if (dir.x === -nx && dir.y === -ny && snake.length > 1) return;
  queuedDir = { x: nx, y: ny };
}

document.addEventListener('keydown', (e) => {
  switch (e.key) {
    case 'ArrowUp':    case 'w': case 'W': trySetDir(0, -1); e.preventDefault(); break;
    case 'ArrowDown':  case 's': case 'S': trySetDir(0, 1);  e.preventDefault(); break;
    case 'ArrowLeft':  case 'a': case 'A': trySetDir(-1, 0); e.preventDefault(); break;
    case 'ArrowRight': case 'd': case 'D': trySetDir(1, 0);  e.preventDefault(); break;
  }
});

// Touch — swipe on canvas
let tx = null, ty = null;
canvas.addEventListener('touchstart', (e) => {
  if (e.touches.length > 1) return;
  tx = e.touches[0].clientX; ty = e.touches[0].clientY;
}, { passive: true });
canvas.addEventListener('touchend', (e) => {
  if (tx === null) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - tx, dy = t.clientY - ty;
  tx = ty = null;
  if (Math.abs(dx) < 18 && Math.abs(dy) < 18) return;
  if (Math.abs(dx) > Math.abs(dy)) trySetDir(dx > 0 ? 1 : -1, 0);
  else trySetDir(0, dy > 0 ? 1 : -1);
}, { passive: true });

function bindButton(id, fn) {
  const el = document.getElementById(id);
  if (!el) return;
  el.addEventListener('click', (e) => { e.preventDefault(); fn(); });
  el.addEventListener('touchstart', (e) => { e.preventDefault(); fn(); }, { passive: false });
}
bindButton('upBtn',    () => trySetDir(0, -1));
bindButton('downBtn',  () => trySetDir(0, 1));
bindButton('leftBtn',  () => trySetDir(-1, 0));
bindButton('rightBtn', () => trySetDir(1, 0));

controlsToggle.addEventListener('click', () => {
  controlsEl.classList.toggle('show');
  controlsToggle.textContent = controlsEl.classList.contains('show')
    ? 'Hide on-screen controls'
    : 'Show on-screen controls';
});

document.addEventListener('visibilitychange', () => {
  if (document.hidden && running) {
    running = false;
    cancelAnimationFrame(rAF);
    rAF = null;
  }
});

startButton.addEventListener('click', startGame);
restartButton.addEventListener('click', startGame);

// Boot
snake = [
  { x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 },
];
placeFood();
initTheme();
updateHud();
draw();
</script>
</body>
</html>
