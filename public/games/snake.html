<!DOCTYPE html>
<html lang="en" data-mode="light">

  <title>Neon Snake — Simple Games</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f3f2f2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="icon" href="games-logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="css/arcade-frame.css" rel="stylesheet">
  <style>
    /* Neon Snake keeps its arcade-green accent inside the shared frame. */
    :root { --accent: #17c98a; }
    html[data-mode="dark"] { --accent: #2effb0; }
    #board { background: #060815; border-radius: 14px;
      box-shadow: inset 0 0 40px rgba(60,255,192,.12), 0 0 30px rgba(60,255,192,.12);
      width: 100%; aspect-ratio: 1/1; max-height: 100%; }
    .board-wrap { padding: 8px 16px; }
    .hud .score { color: var(--accent); }
  </style>
</head>
<body>
  <div id="app">
    <div id="frame">
      <div class="topbar">
        <a class="back" href="Gamelist.html">← Games</a>
        <span class="title">Neon Snake</span>
        <div class="btns">
          <button class="icon-btn" id="gazeBtn" aria-label="Eye control">👁</button>
          <button class="icon-btn" id="themeBtn" aria-label="Toggle theme">◐</button>
          <button class="icon-btn" id="restartBtn" aria-label="Restart">↻</button>
        </div>
      </div>

      <div class="hud">
        <div class="stat">
          <div class="label">Score</div>
          <div class="score" id="score">0</div>
          <div id="eyeHost" style="margin-top:4px"></div>
        </div>
        <div class="stat right">
          <div class="label">Length</div>
          <div class="best" id="lengthEl">3</div>
          <div class="label" style="margin-top:6px">Best</div>
          <div class="best" id="high">0</div>
        </div>
      </div>

      <div class="board-wrap">
        <canvas id="board" width="480" height="480"></canvas>
      </div>

      <div class="controls" id="controls">
        <div class="dpad" id="dpad" style="flex:1">
          <div class="empty"></div>
          <button id="upBtn" aria-label="Up">▲</button>
          <div class="empty"></div>
          <button id="leftBtn" aria-label="Left">◀</button>
          <button id="downBtn" aria-label="Down">▼</button>
          <button id="rightBtn" aria-label="Right">▶</button>
        </div>
        <button class="btn-primary" id="startBtn">START ▸</button>
      </div>

      <div id="gazeNote"></div>
      <div id="gazeDot"></div>

      <div id="over">
        <div class="card">
          <h2 id="overTitle">Game over</h2>
          <div class="big" id="overScore">0</div>
          <div class="note" id="overNote">Another round?</div>
          <button id="playAgain">PLAY AGAIN</button>
        </div>
      </div>
    </div>
  </div>

<script>
/* ================================================================
   NEON SNAKE — Simple Games (in the shared arcade frame)
   20×20 grid. Eat food → grow + score. Speed rises with score.
   Controls: arrows / WASD, on-screen d-pad, swipe, or (opt-in) gaze.
   ================================================================ */
/* Safe localStorage — iOS Private Mode throws on access; never let that kill
   the whole script. (The old build had a recursive guard that always failed.) */
var store = {
  get: function (k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } },
  set: function (k, v) { try { window.localStorage.setItem(k, v); } catch (e) {} },
};

var COLS = 20, ROWS = 20;
var canvas = document.getElementById('board');
var ctx = canvas.getContext('2d');
var scoreEl = document.getElementById('score');
var lengthEl = document.getElementById('lengthEl');
var highEl = document.getElementById('high');
var startBtn = document.getElementById('startBtn');
var overEl = document.getElementById('over');
var overTitle = document.getElementById('overTitle');
var overScore = document.getElementById('overScore');
var overNote = document.getElementById('overNote');

var snake = [], dir = { x: 1, y: 0 }, queuedDir = null, food = null;
var score = 0, highScore = Number(store.get('snakeHigh') || 0);
var running = false, lastStepTime = 0, stepInterval = 140, rAF = null;

function cellPx() { return canvas.width / COLS; }

/* theme */
function setTheme(m) {
  document.documentElement.setAttribute('data-mode', m);
  store.set('snakeTheme', m);
  var meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', m === 'dark' ? '#171615' : '#f3f2f2');
}
setTheme(store.get('snakeTheme') || 'light');
document.getElementById('themeBtn').addEventListener('click', function () {
  setTheme(document.documentElement.getAttribute('data-mode') === 'dark' ? 'light' : 'dark');
});

function placeFood() {
  var occ = {}; snake.forEach(function (s) { occ[s.x + ',' + s.y] = 1; });
  var empties = [];
  for (var y = 0; y < ROWS; y++) for (var x = 0; x < COLS; x++)
    if (!occ[x + ',' + y]) empties.push({ x: x, y: y });
  if (!empties.length) return finish('You filled the board!');
  food = empties[Math.floor(Math.random() * empties.length)];
}

function updateHud() {
  scoreEl.textContent = score; lengthEl.textContent = snake.length; highEl.textContent = highScore;
}

/* ── neon juice ── */
var particles = [], shake = 0, renderTime = 0, prevSnake = [], stepProgress = 1;
function spawnBurst(cx, cy, hue, n) {
  for (var i = 0; i < n; i++) {
    var a = Math.random() * Math.PI * 2, sp = 1.5 + Math.random() * 3.5;
    particles.push({ x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: 1, hue: hue + (Math.random() * 40 - 20), size: 2 + Math.random() * 3 });
  }
}
function updateParticles(dt) {
  for (var i = 0; i < particles.length; i++) {
    var p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.vx *= 0.94; p.vy *= 0.94; p.life -= dt * 1.8;
  }
  particles = particles.filter(function (p) { return p.life > 0; });
}
function segColor(i, n, alpha) {
  var hue = (150 + i / Math.max(1, n) * 90) % 360;
  return 'hsla(' + hue + ', 90%, ' + (60 - i / n * 10) + '%, ' + alpha + ')';
}

function draw() {
  var px = cellPx(), W = canvas.width, H = canvas.height;
  ctx.save();
  if (shake > 0.1) { ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake); shake *= .85; }
  var bg = ctx.createRadialGradient(W / 2, H / 2, H * .1, W / 2, H / 2, H * .75);
  bg.addColorStop(0, '#0d1330'); bg.addColorStop(1, '#050615');
  ctx.fillStyle = bg; ctx.fillRect(-40, -40, W + 80, H + 80);
  ctx.strokeStyle = 'rgba(90,140,255,0.08)'; ctx.lineWidth = 1;
  for (var i = 1; i < COLS; i++) {
    ctx.beginPath(); ctx.moveTo(i * px, 0); ctx.lineTo(i * px, H); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i * px); ctx.lineTo(W, i * px); ctx.stroke();
  }
  if (food) {
    var fx = food.x * px + px / 2, fy = food.y * px + px / 2, pulse = .5 + Math.sin(renderTime * 6) * .5;
    ctx.save(); ctx.shadowColor = '#ff5a8a'; ctx.shadowBlur = 18 + pulse * 14;
    var grad = ctx.createRadialGradient(fx, fy, 1, fx, fy, px * .5);
    grad.addColorStop(0, '#ffd0e0'); grad.addColorStop(.5, '#ff5a8a'); grad.addColorStop(1, '#c01858');
    ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(fx, fy, px * (.32 + pulse * .06), 0, 7); ctx.fill(); ctx.restore();
  }
  var n = snake.length, t = stepProgress, lerp = function (a, b) { return a + (b - a) * t; };
  ctx.save(); ctx.shadowColor = '#3affc0'; ctx.shadowBlur = 12; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  var pts = snake.map(function (seg, i) {
    var prev = prevSnake[i] || seg;
    return { x: lerp(prev.x, seg.x) * px + px / 2, y: lerp(prev.y, seg.y) * px + px / 2 };
  });
  for (var k = pts.length - 1; k > 0; k--) {
    ctx.strokeStyle = segColor(k, n, .95); ctx.lineWidth = px * (.82 - k / n * .18);
    ctx.beginPath(); ctx.moveTo(pts[k].x, pts[k].y); ctx.lineTo(pts[k - 1].x, pts[k - 1].y); ctx.stroke();
  }
  var head = pts[0];
  ctx.fillStyle = segColor(0, n, 1); ctx.beginPath(); ctx.arc(head.x, head.y, px * .42, 0, 7); ctx.fill();
  ctx.shadowBlur = 0;
  var ex = dir.x * px * .14, ey = dir.y * px * .14, perpX = -dir.y * px * .16, perpY = dir.x * px * .16;
  ctx.fillStyle = '#04121a';
  [1, -1].forEach(function (s) {
    ctx.beginPath(); ctx.arc(head.x + ex + perpX * s, head.y + ey + perpY * s, px * .08, 0, 7); ctx.fill();
  });
  ctx.restore();
  for (var q = 0; q < particles.length; q++) {
    var p = particles[q];
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = 'hsl(' + p.hue + ', 95%, 62%)'; ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 8;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * p.life, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1; ctx.shadowBlur = 0; ctx.restore();
}

function step() {
  if (queuedDir) { dir = queuedDir; queuedDir = null; }
  var head = snake[0], next = { x: head.x + dir.x, y: head.y + dir.y };
  if (next.x < 0 || next.x >= COLS || next.y < 0 || next.y >= ROWS) return finish('Hit a wall.');
  for (var i = 0; i < snake.length - 1; i++)
    if (snake[i].x === next.x && snake[i].y === next.y) return finish('Bit yourself.');
  snake.unshift(next);
  if (food && next.x === food.x && next.y === food.y) {
    var level = Math.floor(score / 100) + 1; score += 10 * level;
    stepInterval = Math.max(55, stepInterval - 4);
    var px = cellPx();
    spawnBurst(food.x * px + px / 2, food.y * px + px / 2, 330, 18);
    shake = Math.min(10, shake + 5); beep(660 + Math.min(score, 600), .06, 'square', .05);
    placeFood(); updateHud();
  } else snake.pop();
}

var audioCtx = null;
function beep(freq, dur, type, vol) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    var o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type || 'sine'; o.frequency.value = freq; g.gain.value = vol || .05;
    o.connect(g); g.connect(audioCtx.destination); o.start();
    g.gain.exponentialRampToValueAtTime(.0001, audioCtx.currentTime + (dur || .08));
    o.stop(audioCtx.currentTime + (dur || .08));
  } catch (e) {}
}

function finish(reason) {
  running = false;
  if (snake.length) {
    var px = cellPx();
    spawnBurst(snake[0].x * px + px / 2, snake[0].y * px + px / 2, 10, 30);
    shake = 16; beep(200, .25, 'sawtooth', .08); setTimeout(function () { beep(120, .3, 'sawtooth', .06); }, 90);
  }
  cancelAnimationFrame(rAF);
  var deathStart = performance.now();
  (function deathAnim(t) { updateParticles(1 / 60); draw(); if (t - deathStart < 800) requestAnimationFrame(deathAnim); })(performance.now());
  rAF = null;
  if (score > highScore) { highScore = score; store.set('snakeHigh', String(highScore)); }
  overTitle.textContent = (score === highScore && score > 0) ? 'New high score!' : 'Game over';
  overScore.textContent = score;
  overNote.textContent = reason;
  overEl.classList.add('show');
  if (window.MatesEyes && eyeFace) MatesEyes.mood(eyeFace, 'sad');
  updateHud();
}

function loop(time) {
  rAF = requestAnimationFrame(loop);
  renderTime = time / 1000;
  if (running) {
    stepProgress = Math.min(1, (time - lastStepTime) / stepInterval);
    if (time - lastStepTime >= stepInterval) {
      lastStepTime = time; prevSnake = snake.map(function (s) { return { x: s.x, y: s.y }; });
      step(); stepProgress = 0;
    }
  }
  updateParticles(1 / 60); draw();
}

function startGame() {
  var mid = Math.floor(COLS / 2);
  snake = [{ x: mid, y: mid }, { x: mid - 1, y: mid }, { x: mid - 2, y: mid }];
  dir = { x: 1, y: 0 }; queuedDir = null; score = 0; stepInterval = 140;
  particles = []; shake = 0; prevSnake = snake.map(function (s) { return { x: s.x, y: s.y }; });
  stepProgress = 1; placeFood(); updateHud();
  running = true; overEl.classList.remove('show');
  if (window.MatesEyes && eyeFace) MatesEyes.mood(eyeFace, 'happy');
  lastStepTime = performance.now();
  if (rAF) cancelAnimationFrame(rAF); rAF = requestAnimationFrame(loop);
}

function trySetDir(nx, ny) {
  if (dir.x === -nx && dir.y === -ny && snake.length > 1) return;
  queuedDir = { x: nx, y: ny };
}

document.addEventListener('keydown', function (e) {
  switch (e.key) {
    case 'ArrowUp': case 'w': case 'W': trySetDir(0, -1); e.preventDefault(); break;
    case 'ArrowDown': case 's': case 'S': trySetDir(0, 1); e.preventDefault(); break;
    case 'ArrowLeft': case 'a': case 'A': trySetDir(-1, 0); e.preventDefault(); break;
    case 'ArrowRight': case 'd': case 'D': trySetDir(1, 0); e.preventDefault(); break;
  }
});

/* swipe on the board */
var tx = null, ty = null;
canvas.addEventListener('touchstart', function (e) {
  if (e.touches.length > 1) return; tx = e.touches[0].clientX; ty = e.touches[0].clientY;
}, { passive: true });
canvas.addEventListener('touchend', function (e) {
  if (tx === null) return;
  var t = e.changedTouches[0], dx = t.clientX - tx, dy = t.clientY - ty; tx = ty = null;
  if (Math.abs(dx) < 18 && Math.abs(dy) < 18) return;
  if (Math.abs(dx) > Math.abs(dy)) trySetDir(dx > 0 ? 1 : -1, 0); else trySetDir(0, dy > 0 ? 1 : -1);
}, { passive: true });

function bindBtn(id, fn) {
  var el = document.getElementById(id); if (!el) return;
  el.addEventListener('click', function (e) { e.preventDefault(); fn(); });
  el.addEventListener('touchstart', function (e) { e.preventDefault(); fn(); }, { passive: false });
}
bindBtn('upBtn', function () { trySetDir(0, -1); });
bindBtn('downBtn', function () { trySetDir(0, 1); });
bindBtn('leftBtn', function () { trySetDir(-1, 0); });
bindBtn('rightBtn', function () { trySetDir(1, 0); });

document.addEventListener('visibilitychange', function () {
  if (document.hidden && running) { running = false; cancelAnimationFrame(rAF); rAF = null; }
});
startBtn.addEventListener('click', startGame);
document.getElementById('restartBtn').addEventListener('click', startGame);
document.getElementById('playAgain').addEventListener('click', startGame);

/* crisp retina canvas that refits on resize/rotate */
function fitCanvas() {
  var rect = canvas.getBoundingClientRect(); if (!rect.width) return;
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var side = Math.round(Math.min(rect.width, rect.height) * dpr);
  if (canvas.width !== side) { canvas.width = side; canvas.height = side; }
  draw();
}
var fitPending = false;
window.addEventListener('resize', function () {
  if (fitPending) return; fitPending = true;
  requestAnimationFrame(function () { fitPending = false; fitCanvas(); });
});

/* ── cute eyes on the score ── */
var eyeFace = null;
if (window.MatesEyes) eyeFace = MatesEyes.make(document.getElementById('eyeHost'));

/* ── opt-in gaze control: head aims, smile turns toward the gaze cursor ── */
var gazeBtn = document.getElementById('gazeBtn');
var gazeNote = document.getElementById('gazeNote'), gazeDot = document.getElementById('gazeDot');
var gazeTarget = null;
function showNote(msg) { gazeNote.textContent = msg; gazeNote.classList.add('show'); setTimeout(function () { gazeNote.classList.remove('show'); }, 2600); }
if (window.GazeControl) {
  GazeControl.attach({
    onMove: function (xn, yn) {
      var r = canvas.getBoundingClientRect();
      var cx = r.left + xn * r.width, cy = r.top + yn * r.height;
      gazeDot.style.left = cx + 'px'; gazeDot.style.top = cy + 'px';
      MatesEyes && MatesEyes.track(cx, cy);
      // steer toward the gaze point relative to the snake head
      if (!running || !snake.length) return;
      var hx = r.left + (snake[0].x + .5) * (r.width / COLS);
      var hy = r.top + (snake[0].y + .5) * (r.height / ROWS);
      var dx = cx - hx, dy = cy - hy;
      if (Math.abs(dx) > Math.abs(dy)) trySetDir(dx > 0 ? 1 : -1, 0); else trySetDir(0, dy > 0 ? 1 : -1);
    },
    onSmile: function () { if (!running) startGame(); beep(880, .08, 'sine', .05); },
    onStatus: function (msg, ok) { showNote(msg); gazeBtn.classList.toggle('on', ok && GazeControl.active); },
  });
  gazeBtn.addEventListener('click', function () {
    GazeControl.toggle();
    setTimeout(function () {
      var on = GazeControl.active;
      gazeBtn.classList.toggle('on', on); gazeDot.classList.toggle('on', on);
    }, 400);
  });
} else { gazeBtn.style.display = 'none'; }

/* boot */
snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
placeFood(); updateHud(); fitCanvas(); draw();
</script>
  <script src="js/mates-eyes.js" defer></script>
  <script src="js/gaze-control.js" defer></script>
  <script src="js/fullscreen.js" defer></script>
</body>
</html>
