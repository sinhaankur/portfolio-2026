<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Bharat seal — DARK variant (matches the mark as shown on dark, and the
       Temple-page / portfolio dark theme): a near-black ground, a gold seal-ring,
       the "भ" script glyph, a located node, and the wave marks — all in warm gold
       so the mark reads on a dark card. Light-ground original lives in the Bharat
       repo (favicon.svg). -->
  <rect width="100" height="100" rx="18" fill="#140f0b"/>
  <circle cx="50" cy="50" r="45" fill="none" stroke="#cc8900" stroke-width="4"/>
  <circle cx="50" cy="50" r="39" fill="none" stroke="#cc8900" stroke-width="6" stroke-dasharray="2.5 7.7"/>
  <text x="50" y="63" font-size="38" text-anchor="middle" fill="#f4e4c1"
        font-family="'Noto Sans Devanagari','Segoe UI',serif">भ</text>
  <circle cx="50" cy="22" r="3.4" fill="#e8c874"/>
  <path d="M34 74 Q50 66 66 74 M38 81 Q50 74 62 81" stroke="#e8c874" stroke-width="2.6" fill="none" stroke-linecap="round"/>
</svg>
